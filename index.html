<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz - O Mentalista</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #111827, #1f2937);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .quiz-container {
            background: #ffffff;
            color: #111827;
            width: 100%;
            max-width: 650px;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        h1 {
            text-align: center;
            margin-top: 0;
        }

        .subtitulo {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        #progresso {
            text-align: center;
            font-weight: bold;
            margin-bottom: 15px;
            color: #555;
        }

        #pergunta {
            font-size: 22px;
            margin-bottom: 20px;
        }

        .opcao {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: 2px solid #ddd;
            border-radius: 10px;
            background: #f8f8f8;
            cursor: pointer;
            font-size: 16px;
            text-align: left;
            transition: 0.2s;
        }

        .opcao:hover {
            background: #e5e7eb;
            transform: scale(1.01);
        }

        .opcao.correta {
            background: #bbf7d0;
            border-color: #22c55e;
        }

        .opcao.errada {
            background: #fecaca;
            border-color: #ef4444;
        }

        #proxima {
            width: 100%;
            padding: 15px;
            margin-top: 15px;
            border: none;
            border-radius: 10px;
            background: #111827;
            color: white;
            font-size: 17px;
            cursor: pointer;
            display: none;
        }

        #proxima:hover {
            background: #374151;
        }

        #resultado {
            text-align: center;
            display: none;
        }

        #resultado h2 {
            font-size: 30px;
        }

        #reiniciar {
            padding: 15px 25px;
            border: none;
            border-radius: 10px;
            background: #111827;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        #reiniciar:hover {
            background: #374151;
        }
    </style>
</head>

<body>

<div class="quiz-container">

    <div id="quiz">

        <h1>🧠 Quiz - O Mentalista</h1>

        <p class="subtitulo">
            Temporadas 1 a 4
        </p>

        <div id="progresso"></div>

        <h2 id="pergunta"></h2>

        <div id="opcoes"></div>

        <button id="proxima" onclick="proximaPergunta()">
            Próxima pergunta
        </button>

    </div>

    <div id="resultado">

        <h1>🎉 Quiz terminado!</h1>

        <h2 id="pontuacao"></h2>

        <p id="mensagem"></p>

        <button id="reiniciar" onclick="reiniciarQuiz()">
            Jogar novamente
        </button>

    </div>

</div>

<script>

const perguntas = [

    {
        pergunta: "Qual é o nome do protagonista de O Mentalista?",
        opcoes: [
            "Patrick Jane",
            "Kimball Cho",
            "Wayne Rigsby",
            "Dennis Abbott"
        ],
        resposta: 0
    },

    {
        pergunta: "Em qual órgão Patrick Jane trabalha como consultor?",
        opcoes: [
            "FBI",
            "CBI",
            "CIA",
            "Polícia de Los Angeles"
        ],
        resposta: 1
    },

    {
        pergunta: "Quem lidera a equipe em que Patrick Jane trabalha?",
        opcoes: [
            "Grace Van Pelt",
            "Madeleine Hightower",
            "Teresa Lisbon",
            "Kimball Cho"
        ],
        resposta: 2
    },

    {
        pergunta: "Quem é o principal inimigo de Patrick Jane?",
        opcoes: [
            "Bret Stiles",
            "Red John",
            "Walter Mashburn",
            "J.J. LaRoche"
        ],
        resposta: 1
    },

    {
        pergunta: "O que Patrick Jane fazia antes de trabalhar com o CBI?",
        opcoes: [
            "Era advogado",
            "Era policial",
            "Era um falso médium",
            "Era agente do FBI"
        ],
        resposta: 2
    },

    {
        pergunta: "Qual personagem é conhecido por ser sério e falar pouco?",
        opcoes: [
            "Wayne Rigsby",
            "Kimball Cho",
            "Patrick Jane",
            "Walter Mashburn"
        ],
        resposta: 1
    },

    {
        pergunta: "Em qual episódio da quarta temporada Jane perde a memória?",
        opcoes: [
            "Fugue in Red",
            "Red Badge",
            "The Crimson Hat",
            "Little Red Book"
        ],
        resposta: 0
    },

    {
        pergunta: "Qual personagem faz parte da equipe de Lisbon durante as primeiras temporadas?",
        opcoes: [
            "Grace Van Pelt",
            "Dennis Abbott",
            "Susan Darcy",
            "Bob Kirkland"
        ],
        resposta: 0
    },

    {
        pergunta: "No final da quarta temporada, Jane aparece em qual cidade?",
        opcoes: [
            "Miami",
            "Las Vegas",
            "Nova York",
            "Seattle"
        ],
        resposta: 1
    },

    {
        pergunta: "Até o final da quarta temporada, a identidade de Red John já foi definitivamente revelada?",
        opcoes: [
            "Sim",
            "Não"
        ],
        resposta: 1
    }

];

let perguntaAtual = 0;
let pontos = 0;
let respondeu = false;


function mostrarPergunta() {

    respondeu = false;

    const pergunta = perguntas[perguntaAtual];

    document.getElementById("progresso").textContent =
        "Pergunta " + (perguntaAtual + 1) + " de " + perguntas.length;

    document.getElementById("pergunta").textContent =
        pergunta.pergunta;

    const opcoes = document.getElementById("opcoes");

    opcoes.innerHTML = "";

    document.getElementById("proxima").style.display = "none";


    pergunta.opcoes.forEach(function(opcao, indice) {

        const botao = document.createElement("button");

        botao.textContent = opcao;

        botao.className = "opcao";

        botao.onclick = function() {
            responder(indice, botao);
        };

        opcoes.appendChild(botao);

    });

}


function responder(indice, botaoClicado) {

    if (respondeu) {
        return;
    }

    respondeu = true;

    const pergunta = perguntas[perguntaAtual];

    const botoes = document.querySelectorAll(".opcao");

    botoes.forEach(function(botao, indice) {

        botao.disabled = true;

        if (indice === pergunta.resposta) {
            botao.classList.add("correta");
        }

    });


    if (indice === pergunta.resposta) {

        pontos++;

    } else {

        botaoClicado.classList.add("errada");

    }

    document.getElementById("proxima").style.display = "block";

}


function proximaPergunta() {

    perguntaAtual++;

    if (perguntaAtual < perguntas.length) {

        mostrarPergunta();

    } else {

        mostrarResultado();

    }

}


function mostrarResultado() {

    document.getElementById("quiz").style.display = "none";

    document.getElementById("resultado").style.display = "block";

    document.getElementById("pontuacao").textContent =
        "Você acertou " + pontos + " de " + perguntas.length + " perguntas!";


    let mensagem = "";

    if (pontos === 10) {

        mensagem = "🧠 Você é praticamente um Patrick Jane!";

    } else if (pontos >= 8) {

        mensagem = "🔥 Mandou muito bem! Você conhece bastante O Mentalista.";

    } else if (pontos >= 5) {

        mensagem = "👍 Bom trabalho! Mas ainda dá para melhorar.";

    } else {

        mensagem = "📺 Hora de rever alguns episódios!";

    }

    document.getElementById("mensagem").textContent = mensagem;

}


function reiniciarQuiz() {

    perguntaAtual = 0;

    pontos = 0;

    document.getElementById("resultado").style.display = "none";

    document.getElementById("quiz").style.display = "block";

    mostrarPergunta();

}


mostrarPergunta();

</script>

</body>
</html>
